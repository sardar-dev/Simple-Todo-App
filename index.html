<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todoList</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <h1> ToDo List </h1>
      <form onsubmit="mainn(event)">
        <input class="input" placeholder="Type something" />

        <button class="button">➕</button>
      </form>

      <p class="empty"></p>

      <ul class="ul"></ul>

      <p class="total">Total count</p>
      <button class="delete" onclick="deleteAll()">Delete All</button>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
